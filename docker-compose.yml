services:
  api:
    build: .
    container_name: ai-productivity-assistant-api
    ports:
      - "3000:3000"
    volumes:
      - ./db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp:
    build: .
    container_name: ai-productivity-assistant-mcp
    command: node services/mcp/server.js
    ports:
      - "3001:3001"
    environment:
      - TASK_API_URL=http://api:3000
      - MCP_PORT=3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
