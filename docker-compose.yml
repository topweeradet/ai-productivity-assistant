services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb/pb_data

  bot:
    build: .
    container_name: telegram-bot
    command: node services/bot/index.js
    restart: unless-stopped
    depends_on:
      - pocketbase
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID}
      - POCKETBASE_URL=http://pocketbase:8090

  api:
    build: .
    container_name: ai-productivity-assistant-api
    ports:
      - "3000:3000"
    volumes:
      - ./db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp:
    build: .
    container_name: ai-productivity-assistant-mcp
    command: node services/mcp/server.js
    ports:
      - "3001:3001"
    environment:
      - TASK_API_URL=http://api:3000
      - MCP_PORT=3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
